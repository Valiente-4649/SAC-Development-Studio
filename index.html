// Keep special-attack properties in the same readable order as SAC's mob templates.
const MOB_ATTACK_ORDER=['attackId','rangeLevel','damageMultiplier','chargeTicks','stunChance','stunLevel','paralyzeChance','paralyzeLevel','poisonDuration','poisonChance'];
function orderedMobRecord(record){
 if(!record||typeof record!=='object'||Array.isArray(record))return record;
 if(!Array.isArray(record.specialAttacks))return record;
 const output={...record};
 output.specialAttacks=record.specialAttacks.map(attack=>{
  if(!attack||typeof attack!=='object'||Array.isArray(attack))return attack;
  const ordered={};
  for(const key of MOB_ATTACK_ORDER)if(Object.hasOwn(attack,key))ordered[key]=attack[key];
  for(const [key,value] of Object.entries(attack))if(!Object.hasOwn(ordered,key))ordered[key]=value;
  return ordered;
 });
 return output;
}
function orderedExportData(filename,value){
 if(filename!=='mobs.json'||!value||typeof value!=='object'||Array.isArray(value))return value;
 return Object.fromEntries(Object.entries(value).map(([key,record])=>[key,orderedMobRecord(record)]));
}

 const ta=document.createElement('textarea');ta.value=code;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw Error('copy failed');
 }savedStatus('✓ コードをコピーしました。対象JSONに貼り付けてください');}
 catch(e){savedStatus('⚠ 自動コピーできませんでした。下のコードを長押ししてコピーしてください');}
}

$('search').oninput=e=>{search=e.target.value;drawList()};$('new').onclick=()=>{if(isRaw())return;let sample=entries()[0]?.obj;let obj=sample&&typeof sample==='object'?clone(sample):{};let id='new_entry';if(isDict()){let i=1;while(Object.hasOwn(data[current],id))id='new_entry_'+i++;if(obj&&typeof obj==='object'){if('id'in obj)obj.id=id;if('recipeId'in obj)obj.recipeId=id;if('name'in obj)obj.name=equipmentFile()?equipmentName(id):'新規データ'}data[current][id]=obj;selected=id}else{data[current].push(obj);selected=String(data[current].length-1)}search='';$('search').value='';save();draw()};$('duplicate').onclick=()=>{const r=getRecord();if(!r)return;const obj=clone(r.obj);if(isDict()){let id=r.id+'_copy',i=2;while(Object.hasOwn(data[current],id))id=r.id+'_copy'+i++;if(obj&&typeof obj==='object'&&obj.id===r.id){obj.id=id;if(equipmentFile()&&isAutoEquipmentName(obj.name,r.id))obj.name=equipmentName(id)}data[current][id]=obj;selected=id}else{data[current].push(obj);selected=String(data[current].length-1)}search='';$('search').value='';save();draw()};$('remove').onclick=()=>{const r=getRecord();if(!r||!confirm(recordLabel(r)+' を削除しますか？'))return;if(isDict())delete data[current][selected];else data[current].splice(+selected,1);selected=null;save();draw()};
function bytes(s){return new TextEncoder().encode(s)}function download(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}function fileText(n){return typeof data[n]==='string'?data[n]:JSON.stringify(orderedExportData(n,data[n]),null,2)+'\n'}$('export').onclick=()=>download(new Blob([fileText(current)],{type:'application/json;charset=utf-8'}),current);$('import').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const txt=await f.text();try{const obj=JSON.parse(txt);if(!confirm(current+' を読み込んだJSONで上書きしますか？'))return;data[current]=obj;selected=null;save();draw();savedStatus('✓ JSONを読み込みました')}catch(err){alert('標準JSONとして読み込めません: '+err.message+'\n元のテキストを直接編集するには該当ファイルを開いてください')}};
// Dependence-free ZIP writer (STORE mode) for GitHub Pages / offline use
const table=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let i=0;i<8;i++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;table[n]=c>>>0}function crc32(buffer){let c=0xffffffff;for(let v of buffer)c=table[(c^v)&255]^(c>>>8);return(c^0xffffffff)>>>0}function zipBlob(named){const parts=[];const central=[];let offset=0;let i=0;for(const [name,text]of Object.entries(named)){const nb=bytes(name),b=bytes(text),crc=crc32(b);const local=new Uint8Array(30+nb.length),v=new DataView(local.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint32(14,crc,true);v.setUint32(18,b.length,true);v.setUint32(22,b.length,true);v.setUint16(26,nb.length,true);local.set(nb,30);parts.push(local,b);const c=new Uint8Array(46+nb.length),cv=new DataView(c.buffer);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint32(16,crc,true);cv.setUint32(20,b.length,true);cv.setUint32(24,b.length,true);cv.setUint16(28,nb.length,true);cv.setUint32(42,offset,true);c.set(nb,46);central.push(c);offset+=local.length+b.length;i++}const cd=central.reduce((n,b)=>n+b.length,0);const end=new Uint8Array(22),dv=new DataView(end.buffer);dv.setUint32(0,0x06054b50,true);dv.setUint16(8,i,true);dv.setUint16(10,i,true);dv.setUint32(12,cd,true);dv.setUint32(16,offset,true);return new Blob([...parts,...central,end],{type:'application/zip'})}$('exportAll').onclick=()=>{const named={};for(const n of Object.keys(data))named[n]=fileText(n);download(zipBlob(named),'SAC-json-export.zip');savedStatus('✓ 全設定ファイルのZIPを出力しました')};draw();
